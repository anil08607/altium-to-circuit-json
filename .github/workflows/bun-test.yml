# Created using @tscircuit/plop (npm install -g @tscircuit/plop)
name: Bun Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download checksum-pinned Altium references
        run: bun run download-references
      - name: Run tests
        run: bun test
      - name: Upload visual snapshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altium-circuit-json-svg-snapshots
          path: |
            tests/**/__snapshots__/*.snap.svg
            tests/**/__snapshots__/*.snap.png
            tests/**/__snapshots__/*.diff.png
          if-no-files-found: ignore
